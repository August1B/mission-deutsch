<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2EF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Mission Deutsch App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, Pop agency world of the deck: paper ground, rounded white cards, tilted keyword pills, lime = gain, orange = trap. Single committed light look. */
:root{
  --ink:#121212; --paper:#F2F2EF; --card:#FFFFFF; --lime:#C6F432; --orange:#FF6B1A; --muted:#5E5E57; --line:#DADAD3; --ink-soft:#2A2A27;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 100px;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:14px;flex:1;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.d{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;background:var(--ink);color:var(--lime);white-space:nowrap}
.tilt{display:inline-block;border-radius:14px;padding:6px 12px 0;transform:rotate(-2deg)}
.label{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r-xl);padding:20px}
.dark{background:var(--ink);color:var(--paper)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.star{display:inline-block;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border-radius:999px;font-family:var(--display);font-weight:900;font-size:27px;text-transform:uppercase;letter-spacing:.4px;background:var(--ink);color:var(--paper);transition:transform .12s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.orange{background:var(--orange);color:var(--ink)}
.btn[disabled]{opacity:.28;pointer-events:none}
.textbtn{font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:8px}
.sticky-cta{position:sticky;bottom:0;padding-top:10px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 30%);margin-top:auto}

/* Hub */
.hero{display:flex;flex-direction:column;gap:8px;padding:6px 2px 4px;position:relative}
.hero h1{font-size:76px}
.hero .tilt{background:var(--lime);font-size:76px}
.hero .ast{position:absolute;right:4px;top:44px;width:62px;height:62px}
.tile{border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;position:relative;overflow:hidden}
.tile h2{font-size:48px}
.tile p{font-size:15px;max-width:30ch}
.tile .go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--ink);color:var(--paper)}
.tile.lime{background:var(--lime)}
.tile.orange{background:var(--orange)}
.lock{display:flex;gap:8px}
.lock input{flex:1;min-width:0;height:54px;border-radius:999px;border:2px solid var(--ink);background:var(--card);padding:0 20px;font-weight:700;font-size:18px;letter-spacing:3px;text-transform:uppercase}
.lock button{height:54px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700}
.err{font-size:14px;font-weight:700;min-height:20px}
.fineprint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* Bingo */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:8px 12px 8px 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-lg);background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;position:relative;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.9;font-size:clamp(15px,5vw,23px);overflow-wrap:anywhere;hyphens:manual;transition:background .18s,transform .12s}
.cell:active{transform:scale(.95)}
.cell.on{background:var(--lime)}
.cell.on::after{content:"";position:absolute;inset:7px;border:3px solid var(--ink);border-radius:16px;opacity:.9}
.cell.free{background:var(--ink);color:var(--lime);pointer-events:none}
.cell.win{background:var(--orange)}
.hint{font-size:15px}
.counter{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase}

/* Auction */
.bal{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.bal .v{font-family:var(--display);font-weight:900;font-size:46px;font-variant-numeric:tabular-nums}
.bal .k{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.done-ok{background:var(--lime);outline:1.5px solid var(--ink)}
.dots i.done-ko{background:var(--orange)}
.dots i.now{background:var(--ink)}
.rule{background:var(--card);border-radius:var(--r-xl);padding:22px 20px 24px;display:flex;flex-direction:column;gap:12px;min-height:170px}
.rule .txt{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:38px;line-height:.92;text-wrap:balance}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border-radius:var(--r-lg);padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--card);border:3px solid transparent;text-align:left;transition:background .15s,border-color .15s,transform .12s}
.pick:active{transform:scale(.97)}
.pick .d{font-size:30px}
.pick small{font-size:12.5px;color:var(--muted);font-weight:500}
.pick[aria-pressed="true"]{border-color:var(--ink)}
.pick.good[aria-pressed="true"]{background:var(--lime)}
.pick.trap[aria-pressed="true"]{background:var(--orange)}
.pick[aria-pressed="true"] small{color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:58px;border-radius:999px;background:var(--card);font-family:var(--display);font-weight:900;font-size:24px;border:3px solid transparent;font-variant-numeric:tabular-nums;transition:background .15s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.chip.allin{font-size:19px}
.chip.allin[aria-pressed="true"]{background:var(--orange);color:var(--ink);border-color:var(--ink)}
.chip[disabled]{opacity:.25;pointer-events:none}
.step{display:flex;flex-direction:column;gap:8px}
.locked{border-radius:var(--r-xl);padding:26px 22px;display:flex;flex-direction:column;gap:14px;background:var(--ink);color:var(--paper)}
.locked .d{font-size:64px;color:var(--lime)}
.pulse{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.pulse i{width:12px;height:12px;border-radius:50%;background:var(--orange);display:block;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
.reveal{border-radius:var(--r-xl);padding:24px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.reveal.good{background:var(--lime)}
.reveal.trap{background:var(--orange)}
.stamp{align-self:flex-start;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:58px;line-height:.85;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 16px 2px;transform:rotate(-3deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.delta{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;text-transform:uppercase}
.expl{font-size:17px;font-weight:500}
.rs{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.rs .label{color:var(--lime)}
.rs p{font-size:19px;font-weight:700;line-height:1.3}
.broke{background:var(--card);border-radius:var(--r-lg);padding:14px 16px;font-size:14.5px}

/* End */
.result{border-radius:var(--r-xl);padding:24px 20px;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.result .big{font-family:var(--display);font-weight:900;font-size:110px;line-height:.8;color:var(--lime);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.result .title{align-self:flex-start;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.9;background:var(--orange);color:var(--ink);border-radius:12px;padding:8px 12px 2px;transform:rotate(-2deg)}
.hist{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.hist span{aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:17px}
.hist .ok{background:var(--lime);color:var(--ink)}
.hist .ko{background:var(--orange);color:var(--ink)}
.golden{display:flex;flex-direction:column;gap:8px;list-style:none}
.golden li{background:var(--card);border-radius:var(--r-lg);padding:14px 16px;display:grid;grid-template-columns:28px 1fr;gap:4px 10px}
.golden b.n{font-family:var(--display);font-weight:900;font-size:28px;color:var(--orange);line-height:.9;grid-row:span 2}
.golden .r{font-weight:700}
.golden .s{font-size:14px;color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.overlay.bingo{background:var(--orange)}
.overlay.raise{background:var(--lime)}
.overlay .huge{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(96px,32vw,200px);line-height:.8}
.overlay .sub{font-size:20px;font-weight:700;max-width:22ch}
.overlay .btn{max-width:320px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}

/* Tips bubble */
.tipbtn{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;height:56px;padding:0 18px 0 8px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 8px 24px rgba(18,18,18,.25);font-weight:700;font-size:15px;transition:bottom .25s,transform .12s}
.tipbtn:active{transform:scale(.95)}
.tipbtn .ic{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:26px;line-height:1;position:relative}
.tipbtn.new .ic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--lime);animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.5);opacity:0}}

.tiphide{position:fixed;z-index:41;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(62px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 12px rgba(18,18,18,.2);transition:bottom .25s}
.tiphide.raised{bottom:calc(138px + env(safe-area-inset-bottom,0px))}
.tiptab{position:fixed;z-index:40;right:0;top:46%;width:34px;height:64px;border-radius:16px 0 0 16px;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:26px;box-shadow:0 6px 18px rgba(18,18,18,.25);padding-right:env(safe-area-inset-right,0px);animation:slidein .25s}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
.toast{position:fixed;z-index:80;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.app.has-cta{padding-bottom:28px}
.tipbtn.raised{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(18,18,18,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:480px;max-height:86%;overflow-y:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:44px;line-height:.88}
.sheet .x{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.tiplist{list-style:none;display:flex;flex-direction:column;gap:8px}
.tiplist li{background:var(--card);border-radius:var(--r-lg);padding:13px 15px;display:grid;grid-template-columns:30px 1fr;gap:2px 10px;align-items:start}
.tiplist b.n{font-family:var(--display);font-weight:900;font-size:26px;line-height:.95;color:var(--orange);grid-row:span 2}
.tiplist .de{font-weight:700;font-size:15.5px;line-height:1.35}
.fr{font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.35}
.phr{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.phr .label{color:var(--lime)}
.phr p.de{font-size:16.5px;font-weight:700;line-height:1.3}
.phr .fr{color:#B9B9B2}
.words{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.words div{background:var(--card);border-radius:14px;padding:9px 11px;min-width:0}
.words b{display:block;font-size:14px;overflow-wrap:anywhere}
.lang{height:44px;padding:0 14px;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:700;font-size:14px;border:2px solid var(--ink)}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
/* Speed-Tandem */
.tile.ink{background:var(--ink);color:var(--paper)}
.tile.ink .pill{background:var(--lime);color:var(--ink)}
.tile.ink .go{background:var(--lime);color:var(--ink)}
.tile.white{background:var(--card)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:999px;padding:5px}
.seg button{height:52px;border-radius:999px;font-family:var(--display);font-weight:900;font-size:23px;text-transform:uppercase;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.seg button.du[aria-pressed="true"]{background:var(--orange);color:var(--ink)}
.qlist{list-style:none;display:flex;flex-direction:column;gap:8px}
.qitem{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border-radius:var(--r-lg);padding:14px 14px 14px 15px;transition:opacity .2s,background .2s}
.qitem .n{font-family:var(--display);font-weight:900;font-size:26px;line-height:.9;color:var(--orange)}
.qitem .q{font-weight:700;font-size:17px;line-height:1.3}
.qitem .ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.qitem[aria-pressed="true"]{background:var(--paper);outline:2px solid var(--line)}
.qitem[aria-pressed="true"] .q{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.qitem[aria-pressed="true"] .ck{background:var(--lime);border-color:var(--ink)}
.alist li{background:var(--card);border-radius:var(--r-lg);padding:13px 15px;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.alist .n{font-family:var(--display);font-weight:900;font-size:26px;line-height:.95;color:var(--orange)}
.alist .a{font-weight:700;font-size:16.5px;line-height:1.35}
.korr{display:flex;flex-direction:column;gap:8px}
.korr div{background:var(--card);border-radius:var(--r-lg);padding:12px 15px;display:flex;flex-direction:column;gap:3px}
.korr s{color:var(--muted);text-decoration-color:var(--orange);text-decoration-thickness:2px}
.korr b{font-size:16.5px}
.big-say{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.92}

/* Tandem-Pass */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:46px;padding:0 16px;border-radius:999px;background:var(--card);font-weight:700;font-size:15.5px;border:2px solid transparent;transition:background .15s,transform .12s}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.field{height:56px;border-radius:999px;border:2px solid var(--ink);background:var(--card);padding:0 20px;font-weight:700;font-size:18px;width:100%}
.msg{background:var(--ink);color:var(--paper);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:8px}
.msg .label{color:var(--lime)}
.msg p{font-size:18px;line-height:1.45;font-weight:500}
.msg em{font-style:normal;color:var(--lime);font-weight:700}
.passcard{background:var(--lime);border-radius:var(--r-xl);padding:22px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;animation:in .35s}
.passcard .ast{position:absolute;right:16px;top:16px;width:46px;height:46px;color:var(--orange)}
.passcard .who{font-size:58px}
.kv{display:flex;justify-content:space-between;gap:12px;border-top:2px solid var(--ink);padding-top:7px}
.kv span{font-size:14px}
.kv b{font-size:16px;text-align:right}
.passback{background:var(--ink);color:var(--paper);border-radius:var(--r-xl);padding:22px 20px;display:flex;flex-direction:column;gap:12px;animation:in .35s}
.passback .golden li{background:#262624}
.passback .golden .s{color:#B9B9B2}
.safe{background:var(--orange);color:var(--ink);border-radius:var(--r-lg);padding:14px 16px;font-size:15px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twobtn .btn{font-size:22px;min-height:56px}
.btn.ghost{background:var(--card);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.confetti{display:none}.tipbtn.new .ic::after{display:none}}
@media (min-width:420px){.hero h1,.hero .tilt{font-size:86px}}
</style>

<div class="app" id="app" aria-live="polite"></div>

<script>
(function(){
"use strict";
var CODE = "LENA";
var START = 100;
var POOL = ["Partner","Köln","kostenlos","Kultur","Disziplin","Sprach­nachricht","Video­anruf","Erasmus","Hoch­schule","Korrektur","Fehler","Rettungs­satz","regel­mäßig","Adresse","Niveau","Lena"];
var RULES = [

function confetti(){

    ["Pleite? Ihr spielt trotzdem weiter, für die Ehre.", "À zéro ? Vous continuez pour l'honneur."]],
    phrases:[["Wir haben Geld verloren.","Nous avons perdu de l'argent."],["Das war eine Falle!","C'était un piège !"]]},
  end: {t:"Geschafft!", sub:"Und jetzt?", tFr:"Terminé !", subFr:"Et maintenant ?", tips:[
    ["Tippt auf „Hoch damit!“ und zeigt euer Ergebnis.", "Touchez « Hoch damit! » et montrez votre score."],
    ["Macht einen Screenshot der 5 goldenen Regeln.", "Faites une capture d'écran des 5 règles."],
    ["Probiert ein echtes Tandem: Tandem, HelloTalk oder ConversationExchange.", "Essayez un vrai tandem avec ces plateformes."],
    ["Zum Schluss: Euer Tandem-Pass, auch hier in der App.", "Pour finir : votre Tandem-Pass, lui aussi dans l’app."]]}
};
var tipKey = "hub";
var tipBtn = document.createElement("button");
tipBtn.className = "tipbtn"; tipBtn.type = "button"; tipBtn.setAttribute("aria-haspopup", "dialog");
tipBtn.innerHTML = '<span class="ic" aria-hidden="true">?</span><span>Tipps</span>';
var tipHide = document.createElement("button");
tipHide.className = "tiphide"; tipHide.type = "button"; tipHide.setAttribute("aria-label", "Tipps-Knopf ausblenden");
tipHide.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var tipTab = document.createElement("button");
tipTab.className = "tiptab"; tipTab.type = "button"; tipTab.setAttribute("aria-label", "Tipps-Knopf wieder anzeigen");
tipTab.textContent = "?";
document.body.appendChild(tipBtn); document.body.appendChild(tipHide); document.body.appendChild(tipTab);
tipBtn.onclick = function(){ openTips(); };
function toast(msg){ var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }
function applyTipVis(){ var h = !!S.tipsHidden; tipBtn.hidden = h; tipHide.hidden = h; tipTab.hidden = !h; }
tipHide.onclick = function(){ S.tipsHidden = true; save(); applyTipVis(); buzz(10); toast("Tipps ausgeblendet. Der Knopf „?“ rechts holt sie zurück."); tipTab.focus(); };
tipTab.onclick = function(){ S.tipsHidden = false; save(); applyTipVis(); buzz(10); tipBtn.focus(); };
applyTipVis();
function setTips(key){
  tipKey = key;
  S.seenTips = S.seenTips || {};
  tipBtn.classList.toggle("new", !S.seenTips[key]);
  tipBtn.setAttribute("aria-label", "Tipps: " + TIPS[key].t);
  var hasCta = !!app.querySelector(".sticky-cta"); app.classList.toggle("has-cta", hasCta); tipBtn.classList.toggle("raised", hasCta); tipHide.classList.toggle("raised", hasCta); requestAnimationFrame(function(){ var c = !!app.querySelector(".sticky-cta"); app.classList.toggle("has-cta", c); tipBtn.classList.toggle("raised", c); tipHide.classList.toggle("raised", c); });
}
function tipLang(){ return S.tipLang === "fr" ? "fr" : "de"; }
function tipsHTML(){
  var T = TIPS[tipKey], fr = tipLang() === "fr";
  var L = fr ? {phr:"Phrases utiles (à dire en allemand)", words:"Aide vocabulaire", ok:"C'est compris !", hint:"", close:"Fermer", sw:"Deutsch"} :
               {phr:"Nützliche Sätze", words:"Wörter-Hilfe", ok:"Alles klar!", hint:"Übersetzung? Tippt oben auf „Français“.", close:"Schließen", sw:"Français"};
  var li = T.tips.map(function(t, i){ return '<li><b class="n">' + (i + 1) + '</b><span class="de">' + esc(fr ? t[1] : t[0]) + '</span></li>'; }).join("");
  var ph = T.phrases ? '<div class="phr"><span class="label">' + L.phr + '</span>' + T.phrases.map(function(p){ return '<div><p class="de">„' + esc(p[0]) + '“</p>' + (fr ? '<p class="fr">' + esc(p[1]) + '</p>' : '') + '</div>'; }).join("") + '</div>' : "";
  var wd = T.words ? '<p class="label">' + L.words + '</p><div class="words">' + T.words.map(function(w){ return '<div><b>' + esc(w[0]) + '</b>' + (fr ? '<span class="fr">' + esc(w[1]) + '</span>' : '') + '</div>'; }).join("") + '</div>' + (fr ? '' : '<p class="fr" style="font-style:normal">' + L.hint + '</p>') : "";
  return '<span class="grab"></span>' +
    '<div class="row" style="align-items:flex-start"><div style="min-width:0"><span class="pill">' + esc(fr ? T.subFr : T.sub) + '</span><h3 id="tipT" style="margin-top:10px">' + esc(fr ? T.tFr : T.t) + '</h3></div>' +
    '<div style="display:flex;gap:8px;flex:none"><button class="lang" id="tipLang" aria-pressed="' + fr + '" lang="' + (fr ? "de" : "fr") + '">' + L.sw + '</button>' +
    '<button class="x" id="tipX" aria-label="' + L.close + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>' +
    '<ol class="tiplist" lang="' + (fr ? "fr" : "de") + '">' + li + '</ol>' + ph + wd +
    '<button class="btn" id="tipOk">' + L.ok + '</button>';
}
function openTips(){
  S.seenTips = S.seenTips || {}; S.seenTips[tipKey] = 1; save(); tipBtn.classList.remove("new");
  var sc = document.createElement("div"); sc.className = "scrim";
  var sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true"); sh.setAttribute("aria-labelledby", "tipT");
  sc.appendChild(sh); document.body.appendChild(sc);
  function close(){ sc.remove(); document.removeEventListener("keydown", onKey); tipBtn.focus(); }
  function onKey(e){ if (e.key === "Escape") close(); }
  function paint(focusId){
    sh.innerHTML = tipsHTML(); sh.scrollTop = 0;
    document.getElementById("tipX").onclick = close;
    document.getElementById("tipOk").onclick = close;
    document.getElementById("tipLang").onclick = function(){ S.tipLang = tipLang() === "fr" ? "de" : "fr"; save(); buzz(10); paint("tipLang"); };
    try { document.getElementById(focusId).focus({preventScroll:true}); } catch (e) {}
  }
  document.addEventListener("keydown", onKey);
  sc.addEventListener("click", function(e){ if (e.target === sc) close(); });
  paint("tipX");
}

render();
})();
</script>
